<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg-apple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f1ec"/>
      <stop offset="100%" stop-color="#e8e2d6"/>
    </linearGradient>
    <linearGradient id="teal-apple" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00B5C5"/>
      <stop offset="55%" stop-color="#0F6F7C"/>
      <stop offset="100%" stop-color="#063C46"/>
    </linearGradient>
  </defs>

  <!-- Rounded background — iOS expects a filled tile -->
  <rect width="200" height="200" rx="44" fill="url(#bg-apple)"/>

  <!-- Pixelated A — scaled down to fit with padding -->
  <g transform="translate(20, 20) scale(0.8)">
    <g fill="url(#teal-apple)">
      <rect x="108" y="14" width="10" height="10"/>
      <rect x="123" y="10" width="14" height="12"/>
      <rect x="98" y="28" width="14" height="10"/>
      <rect x="116" y="26" width="22" height="12"/>
    </g>
    <polygon points="92,44 110,44 70,170 50,170" fill="url(#teal-apple)"/>
    <polygon points="118,44 136,44 178,170 158,170" fill="url(#teal-apple)"/>
    <rect x="76" y="118" width="76" height="12" fill="url(#teal-apple)"/>
    <g fill="url(#teal-apple)">
      <rect x="32" y="174" width="14" height="10"/>
      <rect x="50" y="174" width="20" height="10"/>
      <rect x="158" y="174" width="20" height="10"/>
      <rect x="180" y="174" width="14" height="10"/>
    </g>
  </g>
</svg>
